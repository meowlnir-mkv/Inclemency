[Option Tooltip]
; Graphics
vsync = VSync caps the framerate of your game to equal your monitor's refresh rate, mainly to eliminate screen tearing. This option can enable input lag.
antialias = FXAA, or Fast Approximate Anti-Aliasing, smooths out the jagged edges ("jaggies") of 3D objects to make the overall image feel cleaner and smoother.
gamma = Screen gamma calibrates the midtones and dark greys of the game's image. Adjust to your liking, though setting this option too high or too low can cause the game to look worse.
texlod = The Texture LOD (Level of Detail) Bias dictates the distance at which textures will swap to lower-resolution versions, known as mipmaps. Negative options make the textures more crisp at distances at a slight performance cost, and vice versa.
vram = Textures that are stored in your graphics card's VRAM will load faster, but will negatively affect texture quality.
hudoffset = The HUD offset offsets your heads-up display closer to the center of the screen. This option is primarily intended for use with ultrawide monitors, but can be used without.
viewbob = Viewbobbing is the effect of the camera shaking to simulate the movement of your character's perspective when moving.
fov = The field of view is the extent of the observable game world visible on your screen. High FOVs will allow wider vision at the cost of tunnel vision, and vice versa. Adjust to your liking.

; Audio
musicvol = Adjusts the volume of background music. To mute all music, slide the bar to the left completely.
soundvol = Adjusts the volume of sound effects. To mute all sounds (not including music), slide the bar to the left completely.
localaudio = Toggles whether voice lines use the original, English audio or the one provided by the active locale.
subtitles = Displays text at the bottom of the screen for currently playing dialogue.
closedcaptions = Displays text at the bottom of the screen describing currently playing sound effects.
sfxautorelease = "Sound auto-release" will free a sound from memory if it not used after 5 seconds. Prevents memory allocation issues.
usertrack = Toggles the ability to play custom tracks over channel 1 of the radio. These tracks are loaded from the "SFX\Radio\UserTracks\" directory. Press "1" when the radio is selected to change track.
usertrackmode = Sets the playing mode for the custom tracks. "Repeat" plays every file in alphabetical order. "Random" chooses the next track at random.
usertrackmode.note = Note that the random mode does not prevent previously played tracks from repeating.
usertrackscan = Re-checks the user tracks directory for any new or removed sound files.

; Controls
mousesensitivty = Adjusts the speed of the mouse pointer.
mousesmoothing = Adjusts the amount of smoothing of the mouse pointer.
binds = Configure the in-game control scheme.

; Advanced
showhud = Shows or hides the game's heads-up display, which includes the blink and stamina bars, floating hand icons, on-screen messages, etc.
console = Allows or bars the use of the developer console in-game by pressing the {0} key.
console.note = On saves where you've used the console, earning of the Integrity achievement will be disabled.
speedrunmode = Displays a timer and changes how play time is tracked to conform to the requirements of speedrunning.
numericseeds = Allows seeds to be entered as integers, which will be used to directly seed the game's internal random number generator. When no seed is entered, the elapsed milliseconds since the computer started is used.
achpopup = Enable or disable notifications for unlocking achievements.
launcher = Enable or disable the launcher displayed when booting the game.
showfps = Enable or disable a counter in the top-left corner that displays the frames per second (FPS) the game is currently running at.
framelimit = Caps the game's frame rate to the desired value. Capping the frame rate is likely to introduce input lag, but can also produce less hardware strain and a more consistent frame delivery.
framelimit.note = A frame cap of at least 60 is recommended in most cases, unless the situation calls for a smaller one.

